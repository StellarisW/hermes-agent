<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600, initial-scale=1">
<title>Systemd watchdog recovery</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; margin: 0; overflow: hidden; background: #07111f; }
  body { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  svg { display: block; width: 1600px; height: 900px; }
  .title { font-size: 48px; font-weight: 760; letter-spacing: -1.1px; fill: #f5f8ff; }
  .subtitle { font-size: 22px; font-weight: 480; fill: #bfccdc; }
  .eyebrow { font-size: 18px; font-weight: 760; letter-spacing: 1.8px; fill: #72b6ff; }
  .panel-title { font-size: 28px; font-weight: 740; fill: #f5f8ff; }
  .panel-copy { font-size: 21px; font-weight: 500; fill: #c5d2e2; }
  .axis-label { font-size: 19px; font-weight: 650; fill: #aebfd2; }
  .code { font: 650 20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e0ebf8; }
  .status { font-size: 21px; font-weight: 650; fill: #c8d7e8; }
  .state-title { font-size: 23px; font-weight: 770; fill: #f8fbff; }
  .state-body { font-size: 20px; font-weight: 520; fill: #b9c8d9; }
  .arrow-label { font-size: 19px; font-weight: 720; fill: #d7e4f2; }
  .chip { font-size: 20px; font-weight: 650; fill: #d2deec; }
</style>
</head>
<body>
<svg id="canvas" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Systemd event-loop watchdog recovery</title>
  <desc id="desc">A late callback runs before WatchdogSec, renews the lease, and enters degraded recovery. A missing callback sends no heartbeat and lets systemd restart the gateway. Two timely callbacks are required to return from degraded to healthy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0c1930"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="0" r="90%"><stop offset="0" stop-color="#174a78" stop-opacity=".26"/><stop offset=".65" stop-color="#0b1728" stop-opacity=".04"/><stop offset="1" stop-color="#07111f" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#91bce7" stroke-opacity=".045"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000814" flood-opacity=".34"/></filter>
    <marker id="blueArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#58a6ff"/></marker>
    <marker id="amberArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#e3b341"/></marker>
    <marker id="greenArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#3fb950"/></marker>
    <marker id="redArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#ff6b6b"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Header -->
  <text x="64" y="52" class="eyebrow">SYSTEMD WATCHDOG · EVENT-LOOP RECOVERY</text>
  <text x="64" y="104" class="title">RECOVER PROGRESS. RESTART ONLY A TRUE STALL.</text>
  <text x="64" y="140" class="subtitle">A callback that runs proves the loop resumed. A callback that cannot run sends no heartbeat.</text>

  <!-- Comparison panels -->
  <g filter="url(#shadow)">
    <rect class="component container" id="latePanel" x="64" y="166" width="718" height="280" rx="22" fill="#101c2e" stroke="#2c4966"/>
    <rect class="component container" id="stallPanel" x="818" y="166" width="718" height="280" rx="22" fill="#101c2e" stroke="#543541"/>
  </g>

  <!-- Late callback timeline -->
  <g>
    <rect class="component" id="lateBadge" x="88" y="184" width="220" height="34" rx="17" fill="#493a16" stroke="#997623"/>
    <circle cx="110" cy="201" r="6" fill="#e3b341"/>
    <text data-owner="lateBadge" x="128" y="208" class="axis-label" fill="#ffe28a">LATE CALLBACK</text>
    <text data-owner="latePanel" x="88" y="252" class="panel-title">Callback executes before the deadline</text>
    <text data-owner="latePanel" x="88" y="280" class="panel-copy">Delayed is degraded—not dead.</text>

    <line class="connector" x1="112" y1="338" x2="710" y2="338" stroke="#50677f" stroke-width="4" stroke-linecap="round"/>
    <line x1="112" y1="323" x2="112" y2="353" stroke="#58a6ff" stroke-width="3"/>
    <circle cx="112" cy="338" r="7" fill="#58a6ff"/>
    <text data-owner="latePanel" x="88" y="372" class="axis-label">scheduled</text>

    <circle cx="398" cy="338" r="11" fill="#e3b341" stroke="#ffe28a" stroke-width="3"/>
    <text data-owner="latePanel" x="342" y="318" class="arrow-label" fill="#ffe28a">runs late</text>

    <line class="connector" x1="690" y1="326" x2="690" y2="354" stroke="#ff6b6b" stroke-width="3" stroke-dasharray="6 6"/>
    <rect class="component" id="lateDeadlineLabel" x="520" y="292" width="160" height="32" rx="16" fill="#351b25" stroke="#8d3a48"/>
    <text data-owner="lateDeadlineLabel" x="536" y="314" class="axis-label" fill="#ffabb4">WatchdogSec</text>

    <rect class="component" id="lateNotify" x="224" y="378" width="398" height="38" rx="12" fill="#143653" stroke="#3d7cac"/>
    <text data-owner="lateNotify" x="244" y="404" class="code">WATCHDOG=1 + STATUS=degraded</text>
    <text data-owner="latePanel" x="88" y="438" class="status" fill="#79dc8a">Lease renewed · notifier remains alive</text>
  </g>

  <!-- Missing callback timeline -->
  <g>
    <rect class="component" id="stallBadge" x="842" y="184" width="198" height="34" rx="17" fill="#4a2028" stroke="#a04350"/>
    <circle cx="864" cy="201" r="6" fill="#ff6b6b"/>
    <text data-owner="stallBadge" x="882" y="208" class="axis-label" fill="#ffb4bc">NO CALLBACK</text>
    <text data-owner="stallPanel" x="842" y="252" class="panel-title">Callback never executes</text>
    <text data-owner="stallPanel" x="842" y="280" class="panel-copy">The loop cannot schedule its notifier.</text>

    <line class="connector" x1="866" y1="338" x2="1464" y2="338" stroke="#50677f" stroke-width="4" stroke-linecap="round"/>
    <line x1="866" y1="323" x2="866" y2="353" stroke="#58a6ff" stroke-width="3"/>
    <circle cx="866" cy="338" r="7" fill="#58a6ff"/>
    <text data-owner="stallPanel" x="842" y="372" class="axis-label">scheduled</text>
    <path class="connector" d="M932 338H1418" stroke="#ff6b6b" stroke-opacity=".55" stroke-width="3" stroke-dasharray="9 11"/>
    <text data-owner="stallPanel" x="1100" y="318" class="arrow-label" fill="#f4a1aa">no progress</text>

    <line class="connector" x1="1428" y1="326" x2="1428" y2="354" stroke="#ff6b6b" stroke-width="4"/>
    <circle cx="1428" cy="338" r="12" fill="#3b1a24" stroke="#ff6b6b" stroke-width="3"/>
    <path d="M1422 332L1434 344M1434 332L1422 344" stroke="#ffb8bf" stroke-width="3" stroke-linecap="round"/>
    <rect class="component" id="stallDeadlineLabel" x="1258" y="292" width="160" height="32" rx="16" fill="#351b25" stroke="#8d3a48"/>
    <text data-owner="stallDeadlineLabel" x="1274" y="314" class="axis-label" fill="#ffabb4">WatchdogSec</text>

    <rect class="component" id="stallNotify" x="984" y="378" width="400" height="38" rx="12" fill="#3b1d27" stroke="#a04350"/>
    <text data-owner="stallNotify" x="1006" y="404" class="code" fill="#ffd0d5">No WATCHDOG=1 packet</text>
    <text data-owner="stallPanel" x="842" y="438" class="status" fill="#ff9da7">Lease expires · systemd restarts gateway</text>
  </g>

  <!-- State machine panel -->
  <rect class="component container" id="statePanel" x="64" y="470" width="1472" height="326" rx="22" fill="#0d192a" stroke="#29445e"/>
  <text data-owner="statePanel" x="88" y="506" class="eyebrow">RECOVERY HYSTERESIS</text>
  <text data-owner="statePanel" x="378" y="506" class="panel-copy">Two timely callbacks are required before degraded becomes healthy.</text>

  <!-- State cards -->
  <g filter="url(#shadow)">
    <rect class="component node" id="healthyNode" x="100" y="568" width="330" height="94" rx="18" fill="#153622" stroke="#3fb950" stroke-width="2"/>
    <rect class="component node" id="streak0Node" x="635" y="568" width="330" height="94" rx="18" fill="#3b3117" stroke="#e3b341" stroke-width="2"/>
    <rect class="component node" id="streak1Node" x="1170" y="568" width="330" height="94" rx="18" fill="#3b3117" stroke="#e3b341" stroke-width="2"/>
  </g>

  <circle cx="128" cy="600" r="9" fill="#3fb950"/>
  <text data-owner="healthyNode" x="150" y="608" class="state-title">HEALTHY</text>
  <text data-owner="healthyNode" x="128" y="642" class="code">timely → WATCHDOG=1</text>

  <circle cx="663" cy="600" r="9" fill="#e3b341"/>
  <text data-owner="streak0Node" x="685" y="608" class="state-title">DEGRADED · 0 TIMELY</text>
  <text data-owner="streak0Node" x="663" y="642" class="code">WATCHDOG=1 + degraded</text>

  <circle cx="1198" cy="600" r="9" fill="#e3b341"/>
  <text data-owner="streak1Node" x="1220" y="608" class="state-title">DEGRADED · 1 TIMELY</text>
  <text data-owner="streak1Node" x="1198" y="642" class="code">WATCHDOG=1</text>

  <!-- Main transitions: labels live above their own straight connector tracks -->
  <path class="connector" d="M430 615H615" fill="none" stroke="#e3b341" stroke-width="4" marker-end="url(#amberArrow)"/>
  <rect class="component" id="lateTransitionLabel" x="454" y="526" width="142" height="30" rx="15" fill="#483915" stroke="#957321"/>
  <text data-owner="lateTransitionLabel" x="472" y="548" class="arrow-label" fill="#ffe28a">late callback</text>

  <path class="connector" d="M965 615H1150" fill="none" stroke="#58a6ff" stroke-width="4" marker-end="url(#blueArrow)"/>
  <rect class="component" id="timely1TransitionLabel" x="1001" y="526" width="122" height="30" rx="15" fill="#143653" stroke="#3d7cac"/>
  <text data-owner="timely1TransitionLabel" x="1020" y="548" class="arrow-label" fill="#b7dcff">timely #1</text>

  <!-- Reset track: separate from cards, labels, and recovery track -->
  <path class="connector" d="M1336 662V710H800V662" fill="none" stroke="#ff6b6b" stroke-width="4" marker-end="url(#redArrow)"/>
  <rect class="component" id="resetLabel" x="946" y="670" width="244" height="30" rx="15" fill="#3b1c26" stroke="#a04350"/>
  <text data-owner="resetLabel" x="966" y="692" class="arrow-label" fill="#ffabb4">late again → reset to 0</text>

  <!-- Healthy recovery track: physically below the reset track -->
  <path class="connector" d="M1432 662V774H265V662" fill="none" stroke="#3fb950" stroke-width="4" marker-end="url(#greenArrow)"/>
  <rect class="component" id="recoveryLabel" x="528" y="728" width="544" height="34" rx="17" fill="#11311d" stroke="#327a42"/>
  <text data-owner="recoveryLabel" x="550" y="752" class="arrow-label" fill="#9be5a8">timely #2 → WATCHDOG=1 + STATUS=healthy</text>

  <!-- Stable contract footer -->
  <rect class="component" id="footerChip1" x="64" y="824" width="454" height="48" rx="16" fill="#10253b" stroke="#315b82"/>
  <text data-owner="footerChip1" x="90" y="855" class="chip">Default disabled · no config change</text>
  <rect class="component" id="footerChip2" x="573" y="824" width="454" height="48" rx="16" fill="#10253b" stroke="#315b82"/>
  <text data-owner="footerChip2" x="606" y="855" class="chip">Same notifier task · same cadence</text>
  <rect class="component" id="footerChip3" x="1082" y="824" width="454" height="48" rx="16" fill="#10253b" stroke="#315b82"/>
  <text data-owner="footerChip3" x="1110" y="855" class="chip">No callback → systemd restart</text>
</svg>
<script>
window.runGeometryAudit = () => {
  const svg = document.querySelector('#canvas');
  const texts = [...svg.querySelectorAll('text')];
  const components = [...svg.querySelectorAll('.component')];
  const connectors = [...svg.querySelectorAll('.connector')];
  const rect = el => el.getBoundingClientRect();
  const overlap = (a,b,pad=0) => Math.min(a.right-pad,b.right-pad) > Math.max(a.left+pad,b.left+pad) && Math.min(a.bottom-pad,b.bottom-pad) > Math.max(a.top+pad,b.top+pad);
  const reports = [];
  const nonContainers = components.filter(el => !el.classList.contains('container'));

  for (let i=0;i<texts.length;i++) for (let j=i+1;j<texts.length;j++) {
    if (overlap(rect(texts[i]), rect(texts[j]), 1)) reports.push({type:'text-text',a:texts[i].textContent,b:texts[j].textContent});
  }
  for (let i=0;i<nonContainers.length;i++) for (let j=i+1;j<nonContainers.length;j++) {
    if (overlap(rect(nonContainers[i]), rect(nonContainers[j]), 1)) reports.push({type:'component-component',a:nonContainers[i].id,b:nonContainers[j].id});
  }
  for (const text of texts) {
    const tr = rect(text); const owner = text.dataset.owner;
    if (tr.left < 0 || tr.top < 0 || tr.right > 1600 || tr.bottom > 900) reports.push({type:'text-canvas',text:text.textContent,rect:[tr.left,tr.top,tr.right,tr.bottom]});
    const ownerEl = owner && document.getElementById(owner);
    if (ownerEl && !ownerEl.classList.contains('container')) {
      const or = rect(ownerEl);
      if (tr.left < or.left + 6 || tr.right > or.right - 6 || tr.top < or.top + 4 || tr.bottom > or.bottom - 4) reports.push({type:'text-owner-overflow',text:text.textContent,owner,rect:[tr.left,tr.top,tr.right,tr.bottom],ownerRect:[or.left,or.top,or.right,or.bottom]});
    }
    for (const comp of nonContainers) {
      if (comp.id === owner) continue;
      if (overlap(tr, rect(comp), 2)) reports.push({type:'text-component',text:text.textContent,component:comp.id});
    }
  }
  for (const connector of connectors) {
    if (!connector.getTotalLength) continue;
    const n = Math.max(2, Math.ceil(connector.getTotalLength()/3));
    for (const text of texts) {
      const tr = rect(text); let hit=false;
      for (let i=0;i<=n;i++) {
        const p=connector.getPointAtLength(connector.getTotalLength()*i/n);
        const point=svg.createSVGPoint(); point.x=p.x; point.y=p.y;
        const screen=point.matrixTransform(connector.getScreenCTM());
        if (screen.x > tr.left-4 && screen.x < tr.right+4 && screen.y > tr.top-4 && screen.y < tr.bottom+4) { hit=true; break; }
      }
      if (hit) reports.push({type:'connector-text',text:text.textContent,connector:connector.getAttribute('d') || `${connector.getAttribute('x1')},${connector.getAttribute('y1')}→${connector.getAttribute('x2')},${connector.getAttribute('y2')}`});
    }
  }
  return {viewport:[innerWidth,innerHeight,devicePixelRatio],canvas:rect(svg).toJSON(),reports};
};
</script>
</body>
</html>
