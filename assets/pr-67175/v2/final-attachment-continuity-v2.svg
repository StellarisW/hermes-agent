<svg xmlns="http://www.w3.org/2000/svg" id="canvas" class="container" data-infographic-root="true" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Reconnect-safe native attachment delivery</title>
  <desc id="desc">A three-stage flow showing the old stale-adapter failure, the ownership boundary between existing message IDs and unsent payloads, and the reconnect-safe final delivery path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101d"/>
      <stop offset="0.55" stop-color="#0a1728"/>
      <stop offset="1" stop-color="#07121e"/>
    </linearGradient>
    <linearGradient id="before" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#241827"/>
      <stop offset="1" stop-color="#111c2b"/>
    </linearGradient>
    <linearGradient id="ownership" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#102438"/>
      <stop offset="1" stop-color="#0f1d2d"/>
    </linearGradient>
    <linearGradient id="after" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10292c"/>
      <stop offset="1" stop-color="#0e1d2b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000713" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7f96ad"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#55d7ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#66e6aa"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ff7487"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ffc56b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .kicker { font-size: 16px; font-weight: 800; letter-spacing: 2px; }
      .panel-title { font-size: 25px; font-weight: 800; fill: #f4f8fc; }
      .panel-copy { font-size: 18px; font-weight: 520; fill: #9eb1c5; }
      .card-title { font-size: 23px; font-weight: 760; fill: #f2f6fb; }
      .card-copy { font-size: 19px; font-weight: 520; fill: #afbecd; }
      .outcome-title { font-size: 20px; font-weight: 820; letter-spacing: 0.5px; }
      .chip-copy { font-size: 17px; font-weight: 700; fill: #dbe6ef; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1490" cy="35" r="220" fill="#16375a" opacity="0.16"/>
  <circle cx="80" cy="875" r="210" fill="#155047" opacity="0.09"/>
  <path d="M0 130 H1600" stroke="#1a2d42" stroke-width="1"/>

  <!-- Panel/background fills: paint layer 1 -->
  <rect id="invariant-banner" class="component" x="64" y="145" width="1472" height="55" rx="16" fill="#10263a" stroke="#2c5d7d"/>
  <g filter="url(#shadow)">
    <rect id="before-panel" class="component container" x="64" y="220" width="1472" height="170" rx="24" fill="url(#before)" stroke="#5e3145" stroke-width="2"/>
    <rect id="ownership-panel" class="component container" x="64" y="410" width="1472" height="215" rx="24" fill="url(#ownership)" stroke="#2b6386" stroke-width="2"/>
    <rect id="after-panel" class="component container" x="64" y="645" width="1472" height="175" rx="24" fill="url(#after)" stroke="#2a7558" stroke-width="2"/>
  </g>

  <!-- Connectors: paint layer 2. Every shaft ends in a deliberate gutter. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- BEFORE -->
    <path id="before-capture-to-publish" class="connector" d="M562 305 H626" stroke="#7f96ad" stroke-width="3.5" marker-end="url(#arrow-muted)"/>
    <path id="before-publish-to-text" class="connector" d="M912 305 H960 V262 H1006" stroke="#66e6aa" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    <path id="before-publish-to-attachment" class="connector" d="M960 305 V348 H1006" stroke="#ff7487" stroke-width="3.5" marker-end="url(#arrow-red)"/>
    <path id="before-attachment-to-loss" class="connector" d="M1282 348 H1316" stroke="#ff7487" stroke-width="3.5" marker-end="url(#arrow-red)"/>

    <!-- OWNERSHIP -->
    <path id="ownership-existing" class="connector" d="M622 481 H746" stroke="#8ba1b7" stroke-width="3.5" marker-end="url(#arrow-muted)"/>
    <path id="ownership-unsent-resolve" class="connector" d="M622 566 H746" stroke="#55d7ff" stroke-width="3.5" marker-end="url(#arrow-cyan)"/>
    <path id="ownership-resolve-current" class="connector" d="M1062 566 H1186" stroke="#66e6aa" stroke-width="3.5" marker-end="url(#arrow-green)"/>

    <!-- AFTER -->
    <path id="after-payload-resolve" class="connector" d="M562 712 H626" stroke="#55d7ff" stroke-width="3.5" marker-end="url(#arrow-cyan)"/>
    <path id="after-resolve-dispatch" class="connector" d="M912 712 H976" stroke="#66e6aa" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    <path id="after-dispatch-success" class="connector" d="M1232 712 H1265 V684 H1306" stroke="#66e6aa" stroke-width="3.5" marker-end="url(#arrow-green)"/>
    <path id="after-dispatch-failure" class="connector" d="M1265 712 V762 H1306" stroke="#ffc56b" stroke-width="3.5" marker-end="url(#arrow-amber)"/>
  </g>

  <!-- Cards/nodes: paint layer 3 -->
  <!-- BEFORE cards -->
  <rect id="before-capture" class="component" x="300" y="255" width="250" height="100" rx="16" fill="#132235" stroke="#3c546d"/>
  <rect id="before-publish" class="component" x="650" y="255" width="250" height="100" rx="16" fill="#15283a" stroke="#3c607c"/>
  <rect id="before-text" class="component" x="1030" y="235" width="240" height="54" rx="15" fill="#12362e" stroke="#4f9a78"/>
  <rect id="before-attachment" class="component" x="1030" y="321" width="240" height="54" rx="15" fill="#3a1e2b" stroke="#bd5469"/>
  <rect id="before-loss" class="component" x="1340" y="321" width="160" height="54" rx="15" fill="#421d2a" stroke="#dd6077"/>

  <!-- OWNERSHIP cards -->
  <rect id="existing-state" class="component" x="330" y="450" width="280" height="62" rx="15" fill="#172434" stroke="#435a71"/>
  <rect id="owner-a" class="component" x="770" y="450" width="260" height="62" rx="15" fill="#172638" stroke="#536b82"/>
  <rect id="unsent-payload" class="component" x="330" y="535" width="280" height="62" rx="15" fill="#102b40" stroke="#3785ae"/>
  <rect id="resolve-boundary" class="component" x="770" y="535" width="280" height="62" rx="15" fill="#12334a" stroke="#55d7ff"/>
  <rect id="current-adapter" class="component" x="1210" y="535" width="230" height="62" rx="15" fill="#12382f" stroke="#66e6aa"/>

  <!-- AFTER cards -->
  <rect id="pending-payload" class="component" x="300" y="675" width="250" height="75" rx="16" fill="#12303b" stroke="#3b8199"/>
  <rect id="resolve-live" class="component" x="650" y="675" width="250" height="75" rx="16" fill="#123a3b" stroke="#4cae9a"/>
  <rect id="native-dispatch" class="component" x="1000" y="675" width="220" height="75" rx="16" fill="#15352f" stroke="#4e9c78"/>
  <rect id="delivered" class="component" x="1330" y="657" width="200" height="54" rx="15" fill="#12382e" stroke="#66e6aa"/>
  <rect id="failed" class="component" x="1330" y="735" width="200" height="54" rx="15" fill="#3a2b1d" stroke="#d69b45"/>
  <rect id="image-fallback" class="component" x="300" y="770" width="920" height="30" rx="15" fill="#102638" stroke="#315d78"/>

  <!-- Footer chips -->
  <rect id="chip-routing" class="component" x="250" y="846" width="260" height="36" rx="18" fill="#101f2f" stroke="#2b4258"/>
  <rect id="chip-metadata" class="component" x="530" y="846" width="250" height="36" rx="18" fill="#101f2f" stroke="#2b4258"/>
  <rect id="chip-tts" class="component" x="800" y="846" width="330" height="36" rx="18" fill="#101f2f" stroke="#2b4258"/>
  <rect id="chip-images" class="component" x="1150" y="846" width="386" height="36" rx="18" fill="#101f2f" stroke="#2b4258"/>

  <!-- Text: paint layer 4 -->
  <!-- Header -->
  <text x="64" y="50" class="kicker" fill="#8edfff" data-owner="canvas">HERMES GATEWAY · FINAL RESPONSE</text>
  <text x="64" y="98" font-size="44" font-weight="830" fill="#f6f9fc" data-owner="canvas">Reconnect-safe native attachment delivery</text>
  <text x="64" y="124" font-size="19" font-weight="520" fill="#9db0c3" data-owner="canvas">Existing messages keep their owner; unsent payloads follow the current adapter.</text>

  <!-- Invariant banner -->
  <text x="90" y="178" class="kicker" fill="#8edfff" data-owner="invariant-banner">OWNERSHIP INVARIANT</text>
  <text x="350" y="180" font-size="24" font-weight="700" fill="#e6f3fb" data-owner="invariant-banner">Keep existing IDs on A · resolve every unsent payload at its actual send boundary</text>

  <!-- BEFORE labels -->
  <text x="90" y="255" class="kicker" fill="#ff99a8" data-owner="before-panel">BEFORE</text>
  <text x="90" y="285" class="panel-title" data-owner="before-panel">Stale split</text>
  <text x="90" y="313" class="panel-copy" data-owner="before-panel">Text → B</text>
  <text x="90" y="337" class="panel-copy" data-owner="before-panel">Payloads → A</text>

  <text x="325" y="292" class="card-title" data-owner="before-capture">Turn captures A</text>
  <text x="325" y="324" class="card-copy" data-owner="before-capture">handler keeps <tspan class="mono">self</tspan></text>
  <text x="675" y="292" class="card-title" data-owner="before-publish">Publish B</text>
  <text x="675" y="324" class="card-copy" data-owner="before-publish">replacement is live</text>
  <text x="1054" y="269" class="card-title" fill="#dff9ec" data-owner="before-text">Final text → B</text>
  <text x="1054" y="355" class="card-title" fill="#ffe0e5" data-owner="before-attachment">Payloads → A</text>
  <text x="1361" y="346" class="outcome-title" fill="#ffdce2" data-owner="before-loss">A OFFLINE</text>
  <text x="1362" y="367" font-size="16" font-weight="650" fill="#ff9cad" data-owner="before-loss">silent loss</text>

  <!-- OWNERSHIP labels -->
  <text x="90" y="446" class="kicker" fill="#8edfff" data-owner="ownership-panel">OWNERSHIP RULE</text>
  <text x="90" y="477" class="panel-title" data-owner="ownership-panel">Two lanes</text>
  <text x="90" y="507" class="panel-copy" data-owner="ownership-panel">IDs stay.</text>
  <text x="90" y="545" class="panel-copy" data-owner="ownership-panel">Unsent work moves.</text>

  <text x="354" y="477" class="card-title" data-owner="existing-state">Existing IDs</text>
  <text x="354" y="501" class="card-copy" data-owner="existing-state">preview · edit · delete</text>
  <text x="794" y="477" class="card-title" data-owner="owner-a">Owner stays A</text>
  <text x="794" y="501" class="card-copy" data-owner="owner-a">IDs do not migrate</text>

  <text x="354" y="562" class="card-title" data-owner="unsent-payload">Unsent payloads</text>
  <text x="354" y="586" class="card-copy" data-owner="unsent-payload">TTS · image · media · file</text>
  <text x="794" y="562" class="card-title" data-owner="resolve-boundary">Resolve live</text>
  <text x="794" y="586" class="card-copy" data-owner="resolve-boundary">after each await</text>
  <text x="1234" y="562" class="card-title" data-owner="current-adapter">Current B / C</text>
  <text x="1234" y="586" class="card-copy" data-owner="current-adapter">latest replacement</text>

  <!-- AFTER labels -->
  <text x="90" y="681" class="kicker" fill="#8df0bd" data-owner="after-panel">AFTER</text>
  <text x="90" y="711" class="panel-title" data-owner="after-panel">Live routing</text>
  <text x="90" y="741" class="panel-copy" data-owner="after-panel">Resolve per send.</text>
  <text x="90" y="777" class="panel-copy" data-owner="after-panel">No stale binding.</text>

  <text x="324" y="704" class="card-title" data-owner="pending-payload">Pending payload</text>
  <text x="324" y="733" class="card-copy" data-owner="pending-payload">one item at a time</text>
  <text x="674" y="704" class="card-title" data-owner="resolve-live">Resolve current</text>
  <text x="674" y="733" class="card-copy" data-owner="resolve-live">primary or profile</text>
  <text x="1024" y="704" class="card-title" data-owner="native-dispatch">Native send</text>
  <text x="1024" y="733" class="card-copy" data-owner="native-dispatch">platform API</text>

  <text x="1354" y="681" class="outcome-title" fill="#cbf7df" data-owner="delivered">DELIVERED</text>
  <text x="1354" y="702" font-size="16" font-weight="650" fill="#91dcb6" data-owner="delivered">continue</text>
  <text x="1354" y="759" class="outcome-title" fill="#ffe2ae" data-owner="failed">FAILED</text>
  <text x="1354" y="780" font-size="16" font-weight="650" fill="#f0be72" data-owner="failed">kind · safe notice</text>

  <text x="324" y="791" font-size="18" font-weight="700" fill="#a9dcee" data-owner="image-fallback">Base image fallback: Delay → Resolve → Send · repeat per image</text>

  <!-- Footer -->
  <text x="64" y="870" class="kicker" fill="#7890a8" data-owner="canvas">PRESERVED</text>
  <text x="272" y="870" class="chip-copy" data-owner="chip-routing">Primary + profile</text>
  <text x="552" y="870" class="chip-copy" data-owner="chip-metadata">Reply + thread</text>
  <text x="822" y="870" class="chip-copy" data-owner="chip-tts">TTS cleanup + caption fallback</text>
  <text x="1172" y="870" class="chip-copy mono" data-owner="chip-images">send_multiple_images() → None</text>
</svg>
