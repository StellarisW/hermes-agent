<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" data-infographic-root="true">
  <title id="title">Discord queue manager steering a selected queued text turn</title>
  <desc id="desc">The Discord queue manager confirms a snapshot-bound selected text turn, reauthorizes the action, lets the active agent accept the steer, cancels its durable queue row, then rewrites only that FIFO entry and returns a fresh view. Stale access, non-text or inactive turns, rejected steering, and failed durable cancellation do not silently remove queued work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071224"/>
      <stop offset="1" stop-color="#15142c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <marker id="cyan-head" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#53d7ff"/>
    </marker>
    <marker id="violet-head" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#af85ff"/>
    </marker>
    <style>
      .title { font: 700 46px Arial, sans-serif; fill: #f8fbff; }
      .subtitle { font: 400 21px Arial, sans-serif; fill: #b5c4df; }
      .kicker { font: 700 15px Arial, sans-serif; letter-spacing: 3px; fill: #6edfff; }
      .card { fill: #14233f; stroke: #395c82; stroke-width: 2; }
      .active { fill: #102d3c; stroke: #44d1ef; stroke-width: 2; }
      .guard { fill: #2f213d; stroke: #b48aff; stroke-width: 2; }
      .warning { fill: #3b222d; stroke: #f47991; stroke-width: 2; }
      .banner { fill: #211c42; stroke: #9972e8; stroke-width: 2; }
      .heading { font: 700 23px Arial, sans-serif; fill: #ffffff; }
      .body { font: 400 17px Arial, sans-serif; fill: #cfdaef; }
      .tag { font: 700 15px Arial, sans-serif; fill: #86e4ff; }
      .small { font: 400 15px Arial, sans-serif; fill: #c5cde0; }
      .num { font: 700 17px Arial, sans-serif; fill: #9aeaff; }
      .footer { font: 400 15px Arial, sans-serif; fill: #aebdd6; }
      .connector { fill: none; stroke-width: 5; stroke-linecap: round; }
      .main { stroke: #53d7ff; }
      .branch { stroke: #af85ff; }
      .rule { stroke: #2e4260; stroke-width: 1; }
      .badge { fill: #09182c; stroke: #496d96; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 174 H1600 M0 738 H1600" class="rule"/>

  <text x="80" y="70" class="kicker">HERMES GATEWAY · DISCORD QUEUE MANAGER</text>
  <text x="80" y="122" class="title">Steer one queued text turn — without weakening queue safety</text>
  <text x="80" y="158" class="subtitle">A native card action still uses the current snapshot, authorization, durable inbox, and FIFO boundaries.</text>

  <!-- Connectors are painted before cards and end in deliberate gutters. -->
  <path d="M320 355 H368" class="connector main" marker-end="url(#cyan-head)"/>
  <path d="M620 355 H668" class="connector main" marker-end="url(#cyan-head)"/>
  <path d="M920 355 H968" class="connector main" marker-end="url(#cyan-head)"/>
  <path d="M1220 355 H1268" class="connector main" marker-end="url(#cyan-head)"/>
  <path d="M500 470 V548" class="connector branch" marker-end="url(#violet-head)"/>
  <path d="M800 470 V548" class="connector branch" marker-end="url(#violet-head)"/>
  <path d="M1100 470 V548" class="connector branch" marker-end="url(#violet-head)"/>

  <g filter="url(#shadow)">
    <rect id="step1" x="80" y="255" width="240" height="215" rx="18" class="component card"/>
    <rect id="step2" x="380" y="255" width="240" height="215" rx="18" class="component active"/>
    <rect id="step3" x="680" y="255" width="240" height="215" rx="18" class="component active"/>
    <rect id="step4" x="980" y="255" width="240" height="215" rx="18" class="component card"/>
    <rect id="step5" x="1280" y="255" width="240" height="215" rx="18" class="component active"/>
  </g>

  <rect x="104" y="279" width="36" height="29" rx="8" class="badge"/>
  <text x="116" y="300" class="num" data-owner="step1">1</text>
  <text x="104" y="344" class="heading" data-owner="step1">Selected queued</text>
  <text x="104" y="371" class="heading" data-owner="step1">text turn</text>
  <text x="104" y="408" class="body" data-owner="step1">Opaque ID comes from</text>
  <text x="104" y="433" class="body" data-owner="step1">the current snapshot.</text>
  <text x="104" y="455" class="tag" data-owner="step1">not a live position</text>

  <rect x="404" y="279" width="36" height="29" rx="8" class="badge"/>
  <text x="416" y="300" class="num" data-owner="step2">2</text>
  <text x="404" y="344" class="heading" data-owner="step2">Confirm &amp;</text>
  <text x="404" y="371" class="heading" data-owner="step2">reauthorize</text>
  <text x="404" y="408" class="body" data-owner="step2">Owner · slash access</text>
  <text x="404" y="433" class="body" data-owner="step2">session · snapshot ID</text>
  <text x="404" y="455" class="tag" data-owner="step2">all must still match</text>

  <rect x="704" y="279" width="36" height="29" rx="8" class="badge"/>
  <text x="716" y="300" class="num" data-owner="step3">3</text>
  <text x="704" y="344" class="heading" data-owner="step3">Active agent</text>
  <text x="704" y="371" class="heading" data-owner="step3">accepts steer</text>
  <text x="704" y="408" class="body" data-owner="step3">agent.steer(text) injects</text>
  <text x="704" y="433" class="body" data-owner="step3">after the next tool call.</text>
  <text x="704" y="455" class="tag" data-owner="step3">no interrupt · no new turn</text>

  <rect x="1004" y="279" width="36" height="29" rx="8" class="badge"/>
  <text x="1016" y="300" class="num" data-owner="step4">4</text>
  <text x="1004" y="344" class="heading" data-owner="step4">Cancel durable</text>
  <text x="1004" y="371" class="heading" data-owner="step4">queue row</text>
  <text x="1004" y="408" class="body" data-owner="step4">Cancel matching queue ID</text>
  <text x="1004" y="433" class="body" data-owner="step4">before local FIFO rewrite.</text>
  <text x="1004" y="455" class="tag" data-owner="step4">replay boundary stays safe</text>

  <rect x="1304" y="279" width="36" height="29" rx="8" class="badge"/>
  <text x="1316" y="300" class="num" data-owner="step5">5</text>
  <text x="1304" y="344" class="heading" data-owner="step5">Rewrite FIFO</text>
  <text x="1304" y="371" class="heading" data-owner="step5">&amp; fresh view</text>
  <text x="1304" y="408" class="body" data-owner="step5">Remove only selected ID.</text>
  <text x="1304" y="433" class="body" data-owner="step5">Later turns keep order.</text>
  <text x="1304" y="455" class="tag" data-owner="step5">head + overflow preserved</text>

  <text x="80" y="514" class="kicker">FAIL-CLOSED GUARDS</text>
  <g filter="url(#shadow)">
    <rect id="guard1" x="380" y="555" width="240" height="132" rx="16" class="component warning"/>
    <rect id="guard2" x="680" y="555" width="240" height="132" rx="16" class="component warning"/>
    <rect id="guard3" x="980" y="555" width="240" height="132" rx="16" class="component warning"/>
  </g>
  <text x="404" y="594" class="heading" data-owner="guard1">Stale / unauthorized</text>
  <text x="404" y="624" class="body" data-owner="guard1">Reject before steering.</text>
  <text x="404" y="651" class="small" data-owner="guard1">No queue mutation.</text>

  <text x="704" y="594" class="heading" data-owner="guard2">Not steerable</text>
  <text x="704" y="624" class="body" data-owner="guard2">Media, blank, inactive,</text>
  <text x="704" y="649" class="body" data-owner="guard2">or agent rejects.</text>
  <text x="704" y="674" class="small" data-owner="guard2">Keep item queued.</text>

  <text x="1004" y="594" class="heading" data-owner="guard3">Cancel did not commit</text>
  <text x="1004" y="624" class="body" data-owner="guard3">Steer was accepted;</text>
  <text x="1004" y="649" class="body" data-owner="guard3">fresh view keeps item.</text>
  <text x="1004" y="674" class="small" data-owner="guard3">Never claim removal.</text>

  <g filter="url(#shadow)">
    <rect id="invariant" x="270" y="760" width="1060" height="80" rx="18" class="component banner"/>
  </g>
  <text x="310" y="796" class="heading" data-owner="invariant">Invariant: the snapshot-bound action can steer only its selected item.</text>
  <text x="310" y="823" class="body" data-owner="invariant">Session routing, authorization, durable state, and FIFO order never become a live-index shortcut.</text>

  <text x="80" y="878" class="footer">Discord queue manager · confirmation is explicit · later FIFO items remain protected</text>
</svg>
